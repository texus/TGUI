plugins {
    id 'com.android.application'
}

// Updates a file during compilation
// Used to replace instances of 'com.raylib.raymob'
def updateFile(filePath, toReplace, replacement) {
    def file = file(filePath)
    def modifiedContent = file.text.replaceAll(toReplace, replacement)
    file.write(modifiedContent)
}

// Checks if one or more values in a set
// of properties in gradle.properties are true
def isAtLeastOnePropertyTrueForPrefix(String prefix) {
    def properties = project.properties
    return properties.any { key, value ->
        key.startsWith(prefix) && value == 'true'
    }
}

// Returns the hexadecimal code of the desired OpenGL version
// Used to retrieve the code to write in the AndroidManifest.xml
static def getGLVersionCode(String version) {
    def versionCodes = [
            'ES20': '0x00020000',
            'ES30': '0x00030000',
            'ES31': '0x00030001',
            'ES32': '0x00030002'
    ]
    if (!versionCodes.containsKey(version)) {
        throw new IllegalArgumentException("Version '${version}' is not valid. Valid versions are: ${versionCodes.keySet()}")
    }
    return versionCodes[version]
}

// Values used at execution time need to be read during the configuration phase
def appId = project.findProperty('app.application_id')
def appNativeLibName = project.findProperty('app.native_library_name')

android {
    namespace = appId
    compileSdk 34

    defaultConfig {
        minSdk 24
        targetSdk 34

        applicationId appId
        versionCode Integer.parseInt(project.findProperty('app.version_code'))
        versionName project.findProperty('app.version_name')

        // Defining the application name label (to the resources)
        resValue "string", "app_name", project.findProperty('app.name')

        // Generates a build configuration based on the requested features in gradle.properties
        buildConfigField("boolean", "FEATURE_DISPLAY_KEEP_ON", project.findProperty('display.keep_on') ?: "false")
        buildConfigField("boolean", "FEATURE_DISPLAY_IMMERSIVE", project.findProperty('display.immersive') ?: "false")
        buildConfigField("boolean", "FEATURE_DISPLAY_INTO_CUTOUT", project.findProperty('display.into_cutout') ?: "false")

        // Substitution variables for the manifest
        manifestPlaceholders = [
            'GL_VERSION_CODE': getGLVersionCode(project.findProperty('gl.version')) ?: "0x00020000",
            'APP_LIB_NAME': project.findProperty('app.native_library_name') ?: "raymob",
            'APP_ORIENTATION': project.findProperty('app.orientation') ?: "landscape",
            'APP_CATEGORY': project.findProperty('app.category') ?: "DEFAULT",
            'REQUIRE_INTERNET': project.findProperty('requirements.internet') ?: "false",
            'REQUIRE_VIBRATION': project.findProperty('requirements.vibration') ?: "false",
            'REQUIRE_GYROSCOPE': project.findProperty('requirements.gyroscope') ?: "false",
            'REQUIRE_ACCELEROMETER': project.findProperty('requirements.accelerometer') ?: "false"
        ]

        // Give to CMake the name of the library
        externalNativeBuild {
            cmake {
                def nativeLibName = project.findProperty('app.native_library_name') ?: 'raymob'
                def glVersion = project.findProperty('gl.version') ?: 'ES20'

                arguments "-DAPP_LIB_NAME=$nativeLibName", "-DGL_VERSION=$glVersion"
            }
        }
    }

    // Execute the preBuild task before the compilation
    preBuild.doLast {

        // Modify the package name and library name in NativeLoader.java
        updateFile("src/main/java/com/raylib/raymob/NativeLoader.java", "package com.raylib.raymob;", "package " + appId + ";")
        updateFile("src/main/java/com/raylib/raymob/NativeLoader.java", "System.loadLibrary\\(\"raymob\"\\);", "System.loadLibrary\\(\"" + appNativeLibName + "\"\\);")

        // Modify the package name and library name in other java classes
        updateFile("src/main/java/com/raylib/raymob/DisplayManager.java", "package com.raylib.raymob;", "package " + appId + ";")
        updateFile("src/main/java/com/raylib/raymob/SoftKeyboard.java", "package com.raylib.raymob;", "package " + appId + ";")

        // Modify the package name in proguard-rules.pro
        updateFile("proguard-rules.pro", "com.raylib.raymob", appId)

        // Modify the library name in raymob C source
        updateFile("src/main/cpp/deps/raymob/display.c", "com/raylib/raymob", appId.replace(".", "/"))
        updateFile("src/main/cpp/deps/raymob/soft_keyboard.c", "com/raylib/raymob", appId.replace(".", "/"))

    }

    // Execute the postBuild task after the compilation
    gradle.buildFinished {

        // Restore the package name and library name in NativeLoader.java
        updateFile("src/main/java/com/raylib/raymob/NativeLoader.java", "package " + appId + ";", "package com.raylib.raymob;")
        updateFile("src/main/java/com/raylib/raymob/NativeLoader.java", "System.loadLibrary\\(\"" + appNativeLibName + "\"\\);", "System.loadLibrary\\(\"raymob\"\\);")

        // Restore the package name and library name in other java classes
        updateFile("src/main/java/com/raylib/raymob/DisplayManager.java", "package " + appId + ";", "package com.raylib.raymob;")
        updateFile("src/main/java/com/raylib/raymob/SoftKeyboard.java", "package " + appId + ";", "package com.raylib.raymob;")

        // Restore the package name in proguard-rules.pro
        updateFile("proguard-rules.pro", appId, "com.raylib.raymob")

        // Restore the library name in raymob C source
        updateFile("src/main/cpp/deps/raymob/display.c", appId.replace(".", "/"), "com/raylib/raymob")
        updateFile("src/main/cpp/deps/raymob/soft_keyboard.c", appId.replace(".", "/"), "com/raylib/raymob")

    }

    buildTypes {
        debug {
            debuggable true
            jniDebuggable true
        }
        release {
            minifyEnabled true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            debuggable false
            jniDebuggable false
            pseudoLocalesEnabled = false
            zipAlignEnabled true
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version = '3.22.1'
        }
    }
    buildFeatures {
        buildConfig = true
        resValues = true
        viewBinding = true
    }
}

